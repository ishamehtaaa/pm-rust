[package]
name = "polymarket"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full", "sync", "time", "macros", "rt-multi-thread"] }

tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

reqwest = { version = "0.12", features = ["json"] }

alloy = {version = "1.2.1" , features = ["signers", "signer-local"]}
dotenvy = "0.15.7"
once_cell = "1.21.3"
parking_lot = "0.12.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
rust_decimal_macros = "1"

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

clap = { version = "4", features = ["derive"] }

polymarket-client-sdk = {version = "0.3.0", features = ["gamma"]} 

thiserror = "2"
anyhow = "1"




